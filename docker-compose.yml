services:
  db:
    image: postgres:16-alpine
    container_name: blog-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      # Host 5433 -> container 5432, para evitar conflito com um PostgreSQL
      # eventualmente já instalado na máquina (que costuma ocupar a 5432).
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog -d blog']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: blog-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://blog:blog@db:5432/blog?schema=public
      # Em produção, troque por um valor aleatório e longo (ver .env.example).
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - '3000:3000'

  web:
    build:
      context: ./web
      args:
        # O bundle é estático: a URL da API entra em tempo de build e é a
        # que o NAVEGADOR enxerga (host), não o nome do serviço interno.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    container_name: blog-web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '8080:80'

volumes:
  pgdata:
